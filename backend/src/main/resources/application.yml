server:
  port: 8081

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/predictor}
      database: predictor
  application:
    name: predictor
  main:
    allow-bean-definition-overriding: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sync:
    worldcup-url: ${WORLDCUP_SYNC_URL:https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json}
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-replace-in-production-must-be-at-least-32-chars}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}

logging:
  level:
    com.app: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
